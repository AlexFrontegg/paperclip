name: Free runner disk
description: Delete preinstalled toolchains that Paperclip's CI does not use, so disk-hungry builds and tests fit on GitHub-hosted runners.
inputs:
  image-builder:
    description: Also delete the toolchains only the image build can spare, and the preloaded Docker images.
    default: "false"
  minimum-free-gib:
    description: Fail when fewer GiB stay free; 0 skips the check.
    default: "0"
runs:
  using: composite
  steps:
    - shell: bash
      env:
        IMAGE_BUILDER: ${{ inputs.image-builder }}
        MINIMUM_FREE_GIB: ${{ inputs.minimum-free-gib }}
      run: |
        sudo rm -rf /usr/local/lib/android /usr/share/dotnet /usr/share/swift /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
        if [[ "$IMAGE_BUILDER" == "true" ]]; then
          # The image build needs only Docker, curl, jq and the setup-node toolchain on the host.
          sudo rm -rf /usr/local/share/boost /usr/local/lib/node_modules /usr/lib/jvm /usr/local/share/powershell \
            /usr/local/share/chromium /opt/microsoft /opt/google /opt/az /usr/lib/google-cloud-sdk \
            /opt/hostedtoolcache/go /opt/hostedtoolcache/PyPy /opt/hostedtoolcache/Ruby
          docker image prune --all --force > /dev/null
        fi
        df -h .
        available_kb="$(df -Pk . | awk 'NR == 2 {print $4}')"
        if (( available_kb < MINIMUM_FREE_GIB * 1024 * 1024 )); then
          echo "This job needs at least ${MINIMUM_FREE_GIB} GiB free; select a larger hosted runner." >&2
          exit 1
        fi
