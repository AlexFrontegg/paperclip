name: Set up Paperclip
description: Install the pinned Node, pnpm, workspace dependencies, and optional Runner toolchain.
inputs:
  rust:
    description: Install the Runner's repository-owned Rust toolchain and cache its dependencies.
    default: 'false'
runs:
  using: composite
  steps:
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
      with:
        node-version: 24
        package-manager-cache: false
    - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      with:
        version: 9.15.4
        run_install: false
    - name: Locate pnpm store
      id: store
      shell: bash
      run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.store.outputs.path }}
        key: frontegg-pnpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml', 'patches/**') }}
    - name: Install frozen workspace dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
    - name: Prepare workspace links and shared builds
      shell: bash
      run: |
        pnpm preflight:workspace-links
        pnpm --filter @paperclipai/plugin-sdk ensure-build-deps
    - name: Install the pinned Runner toolchain
      if: inputs.rust == 'true'
      shell: bash
      working-directory: packages/paperclip-runner
      run: |
        toolchain="$(rustup show active-toolchain | awk '{print $1}')"
        echo "RUSTUP_TOOLCHAIN=$toolchain" >> "$GITHUB_ENV"
    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      if: inputs.rust == 'true'
      with:
        workspaces: packages/paperclip-runner/runner -> target
        shared-key: frontegg-runner
        cache-workspace-crates: false
        cache-bin: false
        save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/deploy' }}
