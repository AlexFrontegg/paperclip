name: Frontegg PR
on:
  pull_request:
    branches: [deploy]
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
concurrency:
  group: frontegg-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  ci:
    if: ${{ !github.event.pull_request.draft }}
    uses: ./.github/workflows/ci.yml
